[package]
name = "wasmshim-aarch64-translate"
version = "0.0.0"
description = "The AArch64 front half of the translator over wasmshim-translate: A64 blocks decoded and lowered to the kit's IR, the A64 back-half code (guest-state layout, lazy NZCV), page translations. Knows nothing about any OS."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasmshim-aarch64.workspace = true
wasmshim-translate.workspace = true
wasm-encoder = { version = "=0.258.3", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
wasmshim-cpu.workspace = true
wasmparser = { version = "=0.258.3", default-features = false, features = ["validate", "features", "simd"] }

# Executes translated code against the interpreter in tests (native only).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std"] }

[lints]
workspace = true
